<script>
/* Content registry. Each data file calls HUB.tab({...}), HUB.reference({...}) or HUB.review([...]).
   To add a topic: drop a new file in data/ and add a <script> line below (and in build order). */
window.HUB = {
  tabs: [], ref: null, reviewCards: [],
  tab(t) {
    // A tab can be split across several files (e.g. a long book): later calls with the same id add parts and lessons.
    const ex = this.tabs.find(x => x.id === t.id);
    if (!ex) { this.tabs.push(Object.assign({ parts: [], lessons: [] }, t)); return; }
    (t.parts || []).forEach(p => { if (!ex.parts.some(q => q.id === p.id)) ex.parts.push(p); });
    ex.lessons = ex.lessons.concat(t.lessons || []);
    ['tools', 'trackers'].forEach(k => { if (t[k]) ex[k] = (ex[k] || []).concat(t[k]); });
    if (!t.chunk) ['title', 'short', 'icon', 'tagline', 'intro', 'kind'].forEach(k => { if (t[k] && !ex[k]) ex[k] = t[k]; });
  },
  reference(r) { this.ref = r; },
  review(cards) { this.reviewCards = this.reviewCards.concat(cards); }
};
</script>
