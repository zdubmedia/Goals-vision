<script>
/* Content registry. Each data file calls HUB.tab({...}), HUB.reference({...}) or HUB.review([...]).
   To add a topic: drop a new file in data/ and add a <script> line below (and in build order). */
window.HUB = {
  tabs: [], ref: null, reviewCards: [],
  tab(t) { this.tabs.push(t); },
  reference(r) { this.ref = r; },
  review(cards) { this.reviewCards = this.reviewCards.concat(cards); }
};
</script>
